name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt -- --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-all-crates: true

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-17 postgresql-server-dev-17

      - name: Install cargo-pgrx
        run: |
          PGRX_VERSION=$(grep -m1 'pgrx = "' Cargo.toml | sed -E 's/.*"=?([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          if cargo pgrx --version 2>/dev/null | grep -q "pgrx $PGRX_VERSION"; then
            echo "cargo-pgrx $PGRX_VERSION already installed"
          else
            cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
          fi

      - name: Initialize pgrx
        run: cargo pgrx init --pg17=/usr/lib/postgresql/17/bin/pg_config

      - run: cargo clippy --no-default-features --features pg17 -- -D warnings

  test:
    name: Test (PostgreSQL ${{ matrix.pg_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: [17, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: pg${{ matrix.pg_version }}
          cache-all-crates: true

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-${{ matrix.pg_version }} postgresql-server-dev-${{ matrix.pg_version }}

      - name: Install cargo-pgrx
        run: |
          PGRX_VERSION=$(grep -m1 'pgrx = "' Cargo.toml | sed -E 's/.*"=?([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          if cargo pgrx --version 2>/dev/null | grep -q "pgrx $PGRX_VERSION"; then
            echo "cargo-pgrx $PGRX_VERSION already installed"
          else
            cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
          fi

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ matrix.pg_version }}=/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config

      - name: Set permissions
        run: |
          PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config
          sudo chmod a+rwx $($PG_CONFIG --pkglibdir) $($PG_CONFIG --sharedir)/extension /var/run/postgresql/

      - run: cargo pgrx test pg${{ matrix.pg_version }}

  test-sql:
    name: SQL Regression (PostgreSQL ${{ matrix.pg_version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg_version: [17, 18]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: pg${{ matrix.pg_version }}
          cache-all-crates: true

      - name: Install PostgreSQL
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-${{ matrix.pg_version }} postgresql-server-dev-${{ matrix.pg_version }}

      - name: Install cargo-pgrx
        run: |
          PGRX_VERSION=$(grep -m1 'pgrx = "' Cargo.toml | sed -E 's/.*"=?([0-9]+\.[0-9]+\.[0-9]+)".*/\1/')
          if cargo pgrx --version 2>/dev/null | grep -q "pgrx $PGRX_VERSION"; then
            echo "cargo-pgrx $PGRX_VERSION already installed"
          else
            cargo install cargo-pgrx --version "$PGRX_VERSION" --locked
          fi

      - name: Initialize pgrx
        run: cargo pgrx init --pg${{ matrix.pg_version }}=/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config

      - name: Set permissions
        run: |
          PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config
          sudo chmod a+rwx $($PG_CONFIG --pkglibdir) $($PG_CONFIG --sharedir)/extension /var/run/postgresql/

      - name: Install extension
        run: cargo pgrx install --pg-config /usr/lib/postgresql/${{ matrix.pg_version }}/bin/pg_config

      - name: Configure and start PostgreSQL
        run: |
          echo "wal_level = logical" >> ~/.pgrx/data-${{ matrix.pg_version }}/postgresql.conf
          cargo pgrx start pg${{ matrix.pg_version }}

      - name: Run SQL regression tests
        run: |
          PORT=288${{ matrix.pg_version }}
          PGBIN=/usr/lib/postgresql/${{ matrix.pg_version }}/bin
          "$PGBIN/psql" -h localhost -p $PORT -d postgres -c "DROP EXTENSION IF EXISTS pg_noddl CASCADE; DROP TABLE IF EXISTS test_table; DROP PUBLICATION IF EXISTS test_pub; DROP ROLE IF EXISTS noddl_admin; DROP ROLE IF EXISTS regular_user;" 2>/dev/null || true
          ACTUAL=$(mktemp)
          "$PGBIN/psql" -h localhost -p $PORT -d postgres -f sql/test.sql > "$ACTUAL" 2>&1
          if diff -u expected/test.out "$ACTUAL"; then
            echo "SQL regression tests passed"
          else
            echo "SQL regression tests failed"
            exit 1
          fi

      - name: Print PostgreSQL logs
        if: failure()
        run: cat ~/.pgrx/${{ matrix.pg_version }}*.log 2>/dev/null || echo "No logs found"
